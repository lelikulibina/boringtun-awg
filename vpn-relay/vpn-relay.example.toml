# Пример: WG-сервер и два AWG uplink.
# Перед запуском замените ключи и адреса конечных узлов. Файл должен иметь права 0600.
# socket_fwmark необязателен: без него демон назначает уникальную метку автоматически (начиная с 0x1000).

[daemon]
log_level = "info"
stats_interval_secs = 10
nft_table = "vpn_relay"
# false: полностью отключить IPv6 в datapath vpn-relay; true сохраняет dual-stack.
ipv6_enabled = false
# false: демон не меняет sysctl пересылки пакетов. В текущем IPv4-only режиме
# заранее включите только IPv4 forwarding. Для dual-stack отдельно настройте IPv6.
# true используйте только в изолированном сетевом пространстве имён:
# демон меняет forwarding для всего пространства и может повлиять на пересылку
# пакетов и Router Advertisement на всех интерфейсах.
manage_ip_forwarding = false

[interfaces.wg-server]
type = "wg"
address = ["10.10.0.1/24"]
mtu = 1380
listen_port = 51820
private_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

[[interfaces.wg-server.peers]]
public_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
allowed_ips = ["10.10.0.2/32"]
persistent_keepalive_secs = 25

[interfaces.awg-primary]
type = "awg"
address = ["10.20.0.2/32"]
mtu = 1380
listen_port = 51821
private_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
# socket_fwmark не задан: демон назначит его автоматически

[interfaces.awg-primary.awg]
# Необязательно: явный выбор поколения. Если опустить, BoringTun определит
# минимальное совместимое поколение по параметрам ниже.
jc = 4
jmin = 40
jmax = 80
s1 = 0
s2 = 0
s3 = 0
s4 = 0
h1 = "1"
h2 = "2"
h3 = "3"
h4 = "4"
disable_cookies = false
random_trailers = false
# Параметры AWG 3.1. Раскомментируйте их и согласуйте значения на обоих узлах.
# i1 = "<b 0x4142><r 8>"
# i2 = "<t>"
# i3 = "<rc 4>"
# i4 = "<rd 4>"
# i5 = "<dz 2>"
# Ключ HP: ровно 64 шестнадцатеричных символа; одинаковый на обоих узлах.
# При включении HP задайте S1-S4 не менее 12 байт.
# Ключ Header Protection: 32 байта в стандартном Base64, как private_key/public_key.
# Сгенерируйте отдельный ключ командой awg genkey и задайте одинаковое значение на обеих сторонах.
# header_protection_key = "QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI="
# content_padding_addition = "10-100"
# Режим дополнения выбирается автоматически: AWG 3.0 — по MTU, AWG 3.1 — по UDP window.
# rekey_after_time = "100-120"
# rekey_timeout = "3-8"
# reject_after_time = "150-180"
# keepalive_timeout = "7-13"
# max_handshake_attempts = "15-20"

[[interfaces.awg-primary.peers]]
public_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
endpoint = "vpn-primary.example.net:51820"
allowed_ips = ["0.0.0.0/0"]
persistent_keepalive_secs = "25-35"

[interfaces.awg-secondary]
type = "awg"
address = ["10.30.0.2/32"]
mtu = 1380
listen_port = 51822
private_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
# socket_fwmark не задан: демон назначит его автоматически

[interfaces.awg-secondary.awg]
jc = 4
jmin = 40
jmax = 80
s1 = 0
s2 = 0
h1 = "1"
h2 = "2"
h3 = "3"
h4 = "4"

[[interfaces.awg-secondary.peers]]
public_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
endpoint = "vpn-secondary.example.net:51820"
allowed_ips = ["0.0.0.0/0"]
persistent_keepalive_secs = 25

[[routing.rules]]
priority = 10
ingress = "wg-server"
destination = "195.142.0.0/16"
egress = "awg-secondary"

[[routing.rules]]
priority = 20
ingress = "wg-server"
destination = "79.100.22.0/24"
egress = "awg-secondary"

[[routing.rules]]
priority = 100
ingress = "wg-server"
source = "10.10.0.0/24"
destination = "0.0.0.0/0"
egress = "awg-primary"
nat = "masquerade"


# INPUT и OUTPUT по умолчанию запрещают трафик через управляемые TUN-интерфейсы.
# Разрешения задаются только явно. Раскомментируйте при необходимости:
#
# [[firewall.input.rules]]
# interface = "wg-server"
# source = ["10.10.0.2/32"]
# protocol = "tcp"
# ports = [22]
#
# [[firewall.output.rules]]
# interface = "awg-primary"
# destination = ["10.10.0.0/24"]
# protocol = "udp"
# ports = [53]
#
# Для статического SNAT вместо masquerade в соответствующем routing rule:
# nat = "snat"
# nat_to = "203.0.113.10"
