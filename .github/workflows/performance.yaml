name: AWG Performance Benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - feat/amneziawg-3.1-disable-cookies
    paths:
      - .github/workflows/performance.yaml
      - scripts/awg31-go-interop.py
      - docs/AMNEZIAWG_PERFORMANCE_TESTING.md

permissions:
  contents: read

# Avoid overlapping iperf3 runs on the same hosted runner/branch.
concurrency:
  group: awg-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iperf3:
    name: WireGuard vs AWG 3.1 throughput
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Install network and benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping tcpdump iperf3 python3-cryptography
      - name: Build BoringTun userspace device
        run: cargo build -p boringtun-cli --release
      - name: Fetch official AmneziaWG Go reference
        uses: actions/checkout@v6
        with:
          repository: amnezia-vpn/amneziawg-go
          ref: b5928efb6ca19f0153958460c3d141f04abc5c2e
          path: upstream-amneziawg-go
      - name: Build official AmneziaWG Go
        working-directory: upstream-amneziawg-go
        run: go build -v -o ../amneziawg-go .
      - name: Run bidirectional iperf3 benchmarks
        run: sudo python3 scripts/awg31-go-interop.py ./target/release/boringtun-cli ./amneziawg-go --performance
      - name: Upload benchmark reports and packet captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: awg31-iperf3-performance
          path: |
            target/awg31-performance/*.json
            target/awg31-wire-pcaps/*.pcap
          if-no-files-found: warn
          retention-days: 30
