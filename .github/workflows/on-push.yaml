name: PR Status Checks

# `awg-2.0-extensions` alongside `master`: it is this fork's long-lived
# integration branch, and every PR so far has targeted it rather than master.
# With only `master` listed, none of the jobs below had ever run against that
# work -- 47 commits, with only Semgrep and the review bot for company. A
# `pull_request` entry filters on the *base* branch, so this covers the
# short-lived branches that merge into it too.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "master", "awg-2.0-extensions", "feature/**" ]
  pull_request:
    branches: [ "main", "master", "awg-2.0-extensions" ]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the exhaustive 44-scenario interoperability matrix"
        required: false
        type: boolean
        default: false

jobs:
  # Aggregate required checks for this repository's PR validation.
  all-systems-go:
    runs-on: ubuntu-latest
    needs:
      - check_features
      - clippy
      - rustfmt
      - tests
      - integration-tests
      - awg31-interoperability
    steps:
      - run: exit 0

  check_features:
    strategy:
      matrix:
        # macOS is temporarily paused; Linux remains the active validation target.
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --each-feature

  clippy:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack clippy --each-feature

  rustfmt:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo fmt --all --check

  tests:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --each-feature
      - name: Upload resolved Cargo.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

  # Temporarily disabled: Windows checks passed on the previous full matrix.
  # Restore by removing this condition and adding test-windows to all-systems-go.
  test-windows:
    if: ${{ false }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Check Windows
        run: cargo check -p boringtun
      - name: Test Windows
        run: cargo test -p boringtun

  # Real bidirectional wire test against the upstream Go implementation.
  # This is deliberately separate from the unit/integration test matrix above:
  # it needs network namespaces, TUN devices and the external Go reference.
  awg31-interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Install Linux networking and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping tcpdump python3-cryptography
      - name: Build BoringTun userspace device
        run: cargo build -p boringtun-cli --release
      - name: Fetch official AmneziaWG Go reference
        uses: actions/checkout@v6
        with:
          repository: amnezia-vpn/amneziawg-go
          ref: b5928efb6ca19f0153958460c3d141f04abc5c2e
          path: upstream-amneziawg-go
      - name: Build official AmneziaWG Go
        working-directory: upstream-amneziawg-go
        run: go build -v -o ../amneziawg-go .
      - name: Fetch official AmneziaWG Go 3.0.0 reference
        uses: actions/checkout@v6
        with:
          repository: amnezia-vpn/amneziawg-go
          ref: v3.0.0
          path: upstream-amneziawg-go-3.0
      - name: Build official AmneziaWG Go 3.0.0
        working-directory: upstream-amneziawg-go-3.0
        run: go build -v -o ../amneziawg-go-3.0 .
      - name: Fetch official WireGuard Go reference
        uses: actions/checkout@v6
        with:
          repository: WireGuard/wireguard-go
          ref: b3bc704ef0ee21a36298601a9e1e5ff90377ac52
          path: upstream-wireguard-go
      - name: Build official WireGuard Go
        working-directory: upstream-wireguard-go
        run: go build -v -o ../wireguard-go .
      - name: Run quick AWG 3.1 interoperability suite
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full_matrix) }}
        run: |
          sudo python3 scripts/awg31-go-interop.py ./target/release/boringtun-cli ./amneziawg-go --awg30 ./amneziawg-go-3.0 --wireguard ./wireguard-go
      - name: Run full AWG/WireGuard interoperability matrix
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_matrix }}
        run: |
          sudo python3 scripts/awg31-go-interop.py ./target/release/boringtun-cli ./amneziawg-go --full --awg30 ./amneziawg-go-3.0 --wireguard ./wireguard-go
      - name: Upload normalized wire captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awg31-wire-pcaps
          path: target/awg31-wire-pcaps/*.pcap
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install Linux networking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping wireguard-tools iperf3 tcpdump
      - name: Run ignored integration tests
        run: timeout --signal=TERM --kill-after=30s 15m cargo test -- --ignored
      - name: Build router daemon
        run: cargo build -p vpn-relay --bin vpn-relay
      - name: Exercise daemon routing in isolated network namespace
        run: sudo bash scripts/vpn-relay-netns-test.sh
      - name: Verify per-interface forwarding ownership and recovery
        run: sudo bash scripts/vpn-relay-per-interface-forwarding-test.sh
      - name: Verify IPv4/IPv6 per-interface forwarding at packet level
        run: sudo bash scripts/vpn-relay-per-interface-forwarding-packet-test.sh
      - name: Verify bidirectional WireGuard peer traffic
        run: sudo bash scripts/vpn-relay-peer-traffic-test.sh wg
      - name: Verify bidirectional AmneziaWG 3.1 peer traffic
        run: sudo bash scripts/vpn-relay-peer-traffic-test.sh awg
      - name: Verify packet-level multi-uplink routing
        run: sudo bash scripts/vpn-relay-multi-uplink-test.sh
