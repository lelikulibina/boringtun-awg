name: PR Status Checks

# `awg-2.0-extensions` alongside `master`: it is this fork's long-lived
# integration branch, and every PR so far has targeted it rather than master.
# With only `master` listed, none of the jobs below had ever run against that
# work -- 47 commits, with only Semgrep and the review bot for company. A
# `pull_request` entry filters on the *base* branch, so this covers the
# short-lived branches that merge into it too.
on:
  push:
    branches: [ "main", "master", "awg-2.0-extensions", "feat/amneziawg-3.1-disable-cookies" ]
  pull_request:
    branches: [ "main", "master", "awg-2.0-extensions" ]

jobs:
  # Aggregate required checks for this repository's PR validation.
  all-systems-go:
    runs-on: ubuntu-latest
    needs:
      - check_features
      - clippy
      - rustfmt
      - tests
      - integration-tests
      - awg31-interoperability
      - cross-platform-checks
    steps:
      - run: exit 0

  check_features:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --each-feature

  clippy:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack clippy --each-feature

  rustfmt:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo fmt --all --check

  tests:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --each-feature

  # The protocol core is portable even where this repository's TUN device
  # backend is not. Check the full device/CLI stack on macOS and the core
  # protocol crate on Windows so AWG crypto/config changes cannot silently
  # become Unix-only.
  cross-platform-checks:
    strategy:
      matrix:
        os: [ macos-15-intel, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Check device and CLI on macOS
        if: runner.os == 'macOS'
        run: |
          cargo check -p boringtun --all-features
          cargo check -p boringtun-cli
      - name: Check portable protocol core on Windows
        if: runner.os == 'Windows'
        run: cargo check -p boringtun --no-default-features

  # Real bidirectional wire test against the upstream Go implementation.
  # This is deliberately separate from the unit/integration test matrix above:
  # it needs network namespaces, TUN devices and the external Go reference.
  awg31-interoperability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Install Linux networking and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping python3-cryptography
      - name: Build BoringTun userspace device
        run: cargo build -p boringtun-cli --release
      - name: Fetch official AmneziaWG Go reference
        uses: actions/checkout@v6
        with:
          repository: amnezia-vpn/amneziawg-go
          ref: b5928efb6ca19f0153958460c3d141f04abc5c2e
          path: upstream-amneziawg-go
      - name: Build official AmneziaWG Go
        working-directory: upstream-amneziawg-go
        run: go build -v -o ../amneziawg-go .
      - name: Run AWG 3.1 bidirectional interoperability matrix
        run: sudo python3 scripts/awg31-go-interop.py ./target/release/boringtun-cli ./amneziawg-go

  integration-tests:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo test -- --ignored
