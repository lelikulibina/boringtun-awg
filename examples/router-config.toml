# Путь к файлу конфигурации: /etc/vpn-relay/config.toml
# Демон работает от root в Linux. Файл содержит секреты: установите права chmod 0600.

[daemon]
log_level = "info"
stats_interval_secs = 10
nft_table = "vpn_relay"
manage_ip_forwarding = false

[interfaces.wg-server]
protocol = "wg"
role = "server"
ipv6_enabled = true
address = ["10.10.0.1/24"]
mtu = 1380
listen_port = 51820
private_key = "REPLACE_WITH_BASE64_PRIVATE_KEY"
socket_fwmark = 0x1001

[[interfaces.wg-server.peers]]
public_key = "REPLACE_WITH_BASE64_PUBLIC_KEY"
allowed_ips = ["10.10.0.2/32"]
persistent_keepalive_secs = 25

[interfaces.awg-primary]
protocol = "awg3_1"
role = "client"
ipv6_enabled = true
address = ["10.20.0.2/32"]
mtu = 1380
listen_port = 51821
private_key = "REPLACE_WITH_BASE64_PRIVATE_KEY"

[[interfaces.awg-primary.peers]]
public_key = "REPLACE_WITH_BASE64_PUBLIC_KEY"
endpoint = "198.51.100.10:51820"
allowed_ips = ["0.0.0.0/0", "::/0"]
persistent_keepalive_secs = 25

[interfaces.awg-primary.awg]
# Пример структуры. Значения должны соответствовать профилю AWG 3.1.
jc = 5
jmin = 50
jmax = 1000
s1 = 0
s2 = 0
s3 = 0
s4 = 0
# h1-h4, i1-i5, HeaderProtectionKey, CPA и диапазоны таймеров задаются в AWG-профиле.
# Для Header Protection значения S1-S4 должны быть не меньше 12 байт.
# content_padding_mode = "udp_window" # AWG 3.1; значение "mtu" выбирает AWG 3.0

[interfaces.awg-secondary]
protocol = "awg2"
role = "client"
ipv6_enabled = false
address = ["10.30.0.2/32"]
mtu = 1380
listen_port = 51822
private_key = "REPLACE_WITH_BASE64_PRIVATE_KEY"

[[interfaces.awg-secondary.peers]]
public_key = "REPLACE_WITH_BASE64_PUBLIC_KEY"
endpoint = "203.0.113.20:51820"
allowed_ips = ["0.0.0.0/0"]
persistent_keepalive_secs = 25

[routing]
# Для каждого исходящего интерфейса создаётся отдельная таблица маршрутизации.
# Правила применяются только к пересылаемым пакетам, пришедшим с входящего TUN.

[[routing.rules]]
priority = 10
ingress = "wg-server"
destination = "195.142.0.0/16"
egress = "awg-secondary"

[[routing.rules]]
priority = 20
ingress = "wg-server"
destination = "79.100.22.0/24"
egress = "awg-secondary"

[[routing.rules]]
priority = 1000
ingress = "wg-server"
destination = "0.0.0.0/0"
egress = "awg-primary"

[[routing.rules]]
priority = 1010
ingress = "wg-server"
destination = "::/0"
egress = "awg-primary"
